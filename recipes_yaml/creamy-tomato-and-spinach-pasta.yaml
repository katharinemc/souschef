id: creamy-tomato-and-spinach-pasta
name: Creamy Tomato and Spinach Pasta
tags:
- pasta
servings: null
prep_time: 5 mins
cook_time: 20 mins
source: https://www.budgetbytes.com/creamy-tomato-spinach-pasta/
last_planned: null
ingredients:
- name: penne pasta
  quantity: 1/2
  unit: lb
- name: small onion
  quantity: '1'
- name: garlic
  quantity: '2'
  unit: cloves
- name: olive oil
  quantity: '1'
  unit: Tbsp
- name: can diced tomatoes
  quantity: '15'
  unit: oz
- name: dried oregano
  quantity: 1/2
  unit: tsp
- name: dried basil
  quantity: 1/2
  unit: tsp
- name: pinch red pepper flakes (optional)
- name: salt
  quantity: 1/2
  unit: tsp
- name: freshly cracked pepper to taste
- name: tomato paste
  quantity: '2'
  unit: Tbsp
- name: cream cheese
  quantity: '2'
  unit: oz
- name: grated Parmesan
  quantity: 1/4
  unit: cup
- name: bag fresh spinach
  quantity: 1/2 9
  unit: oz.
instructions: 'Bring a large pot of water to a boil over high heat. Add the pasta
  and cook until tender (7-10) minutes. Drain the pasta in a colander.


  While waiting for the pasta to cook, dice the onion and mince the garlic. Cook both
  in a large skillet with the olive oil over medium-low heat until softened and transparent
  (about 5 minutes).


  Add the diced tomatoes (with juices), oregano, basil, red pepper flakes, salt, and
  some freshly cracked pepper to the skillet with the onions and garlic. Stir to combine.
  Add the tomato paste and a 1/2 cup of water to the skillet and stir until the tomato
  paste is dissolved into the sauce.


  Turn the heat down to low. Cut the cream cheese into a few pieces and then add them
  to the skillet with the tomato sauce. Use a whisk to stir the sauce until the cream
  cheese has fully melted in and the sauce is creamy. Add half of the Parmesan to
  the skillet and whisk until it is melted in. Add the remainder of the parmesan and
  whisk until melted in again.


  Add the fresh spinach and gently stir it into the sauce until it has wilted (3-5
  minutes). Add the pasta and stir until it is well coated in the creamy tomato sauce.
  Taste and adjust the salt and pepper as needed. Serve warm.'
notes: KRM always make at least 2x
