id: biscuits-with-sawmill-gravy
name: Biscuits with Sawmill Gravy
tags:
- onRotation
servings: '6'
prep_time: null
cook_time: null
source: https://www.saveur.com/article/Recipes/Classic-Biscuits-Gravy/
last_planned: null
ingredients:
- name: 'For the Biscuits:'
- name: flour plus more for cutter
  quantity: 2 1/2
  unit: cups
- name: baking powder
  quantity: 3 1/2
  unit: tsp.
- name: kosher salt
  quantity: 1 1/2
  unit: tsp.
- name: unsalted butter cubed and chilled plus 2 tbsp. melted
  quantity: '8'
  unit: tbsp.
- name: buttermilk
  quantity: 1 1/2
  unit: cups
- name: 'For the Gravy:'
- name: bacon finely chopped
  quantity: '2'
  unit: slices
- name: pork breakfast sausage
  quantity: '8'
  unit: oz.
- name: flour
  quantity: 1/2
  unit: cup
- name: milk
  quantity: '3'
  unit: cups
- name: heavy cream
  quantity: 1/2
  unit: cup
- name: apple cider vinegar
  quantity: '1'
  unit: tbsp.
- name: cayenne
  quantity: 1/4
  unit: tsp.
- name: Kosher salt and freshly ground black pepper to taste
- name: Hot sauce for serving (optional)
instructions: 'Make the biscuits: Heat oven to 425°. Place flour, baking powder, and
  salt in a large bowl, and whisk to combine. Add chilled butter, and using your fingers,
  rub mixture together until pea-size crumbles form. Add buttermilk, and stir with
  a fork until just combined. Transfer to a floured work surface, and gently pat dough
  into a 6"x4" rectangle, about 1" thick. Dip a 3" round cutter into a bowl of flour,
  and cut out rounds of dough. Press scraps together, and repeat with remaining dough
  until you have about 6 rounds. Brush a 9" cake pan with melted butter, arrange biscuits
  in pan, and brush the tops with melted butter. Bake until golden brown, about 25
  minutes.


  Make the gravy: Place bacon in a 4-qt. saucepan over medium-high heat, and cook,
  stirring occasionally, until its fat renders, about 3 minutes. Add sausage and,
  cook, breaking it into small pieces with a wooden spoon, until browned, about 5
  minutes. Add flour, and cook, stirring, for 2 minutes. Add milk and cream, and bring
  to a boil; reduce heat to medium, and cook, stirring occasionally, until gravy is
  thickened, about 5 minutes. Add vinegar, cayenne, and salt and pepper, and stir
  until combined.


  To serve, split biscuits in half, and cover with gravy. Serve with hot sauce, if
  you like.'
