id: crispy-braised-chicken-thighs-with-cabbage-and-bacon
name: Crispy Braised Chicken Thighs with Cabbage and Bacon
tags: []
servings: '4'
prep_time: 30 minutes
cook_time: 1 hour 15 minutes
source: http://www.seriouseats.com/recipes/2016/01/braised-chicken-thighs-cabbage-bacon-recipe.html
last_planned: null
ingredients:
- name: bone-in skin-on chicken thighs (6 to 8 thighs; 1.15kg)
  quantity: 2 1/2
  unit: pounds
- name: Kosher salt and freshly ground black pepper
- name: (15ml) vegetable oil
  quantity: '1'
  unit: tablespoon
- name: (225g) slab bacon or salt pork cut into 1/2- by 1/4-inch lardons
  quantity: '8'
  unit: ounces
- name: medium onion thinly sliced (about 6 ounces; 170g)
  quantity: '1'
- name: finely shredded cabbage (about 1 medium head; 450g)
  quantity: '1'
  unit: pound
- name: (30ml) whole grain mustard
  quantity: '2'
  unit: tablespoons
- name: (120ml) apple cider vinegar
  quantity: 1/2
  unit: cup
- name: (700ml) homemade or store-bought low-sodium chicken stock
  quantity: '3'
  unit: cups
- name: sugar
  quantity: '3'
  unit: tablespoons
- name: bay leaves
  quantity: '2'
- name: thyme
  quantity: '6'
  unit: sprigs
- name: unsalted butter
  quantity: '2'
  unit: tablespoons
- name: Egg noodles
instructions: '1. Adjust oven rack to center position and preheat oven to 350°F (175°C).
  Season chicken generously with salt and pepper. Heat oil in a 4- to 5-quart straight-sided
  sauté pan over medium-high heat until shimmering. Add chicken, skin side down, and
  cook without moving it until well browned and crisp, about 8 minutes total, lowering
  heat if it starts to smoke excessively. Flip chicken and brown lightly on second
  side, about 3 minutes. Transfer chicken to a large plate and set aside.


  2. Add bacon to pan and cook, stirring, until lightly browned, about 3 minutes.
  Add onion and cook, stirring, until softened and starting to brown, about 4 minutes.
  Add cabbage and cook, stirring, until softened and starting to brown, about 4 minutes.
  Add mustard and vinegar and cook, stirring and scraping up browned bits from bottom
  of pan. Add chicken stock, sugar, bay leaves, and thyme sprigs and bring to a simmer.


  3. Nestle chicken back into sauté pan, leaving the skin above the liquid but submerging
  most of the meat. Transfer pan to oven and cook, uncovered, until chicken is totally
  tender and liquid has reduced by about half, about 45 minutes.


  4. Remove from oven and transfer chicken to a serving platter. Stir butter into
  sauté pan and season to taste with salt and pepper. Serve immediately, spooning
  cabbage and sauce into shallow bowls and topping with chicken.'
notes: 'KRM: sub for chicken w/cilantro and lime in fall/winter'
