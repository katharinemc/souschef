- name: garlic powder
  quantity: 1 1/2
  unit: teaspoons
- name: cayenne
  quantity: 1/2
  unit: teaspoon
- name: large eggs beaten
  quantity: '2'
- name: milk
  quantity: 1/2
  unit: cup
- name: Canola oil peanut oil extra virgin olive oil or other fat for frying
