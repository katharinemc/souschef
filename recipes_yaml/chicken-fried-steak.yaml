instructions: '1 Pound steaks to an even thinness: If you are using round steak instead
  of the pre-tenderized cube steak, you will need to pound the steaks thin or they
  will be way too chewy. (Already tenderized cube steaks can also use some meat mallet
  attention to get more thin.)


  Place each steak between two pieces of plastic wrap. Using a meat mallet, rubber
  mallet, rolling pin, or empty wine bottle, beat the steak until it is very thin,
  less than 1/4-inch.


  As you beat the steak, you will want to turn over often, and spread out the plastic
  wrap which tends to wrinkle as you work.


  2 Salt meat, warm the oven: Sprinkle a little salt over the meat. Preheat the oven
  to 200°F. In the oven put a wire rack over a baking sheet. This will keep the finished
  steaks warm and dry while you cook the gravy.


  3 Dredge steaks in flour, egg, and flour again: Prepare two wide, shallow dishes
  such as a pyrex casserole dish. In the first whisk together the eggs and milk. In
  the second, whisk together the flour, salt, cayenne, and garlic powder.


  Working one at a time, dredge a steak into the flour. Using the heel of your hand,
  press the flour into both sides of the steak.


  Lift up the steak, shake off the excess flour and dip the steak into the egg wash,
  coating it on both sides.


  Lift the steak out of the egg wash, shake off the excess egg wash, and then dredge
  the steak again in the flour. Again, press the flour into the steak on both sides.


  Set aside on a plate. Repeat with remaining steaks.


  4 Fry the steaks: Pour enough oil in a large frying pan to cover the bottom by 1/4-inch.
  Heat the oil to 350°F or when you drop a little flour into the oil it sizzles. If
  the oil doesn''t sizzle it isn''t ready, if it burns, the oil is too hot, reduce
  the heat.


  Working one at a time, lay a flour-egg-coated steak into the hot oil. Gently shake
  the pan a little to wash a little hot oil on the top of the steak. Or you can use
  a metal spoon to spoon some of the oil over the steak. This sets the coating.


  Fry until you see the edges of the steak turn golden brown, about two minutes. Carefully
  turn the steak over in the pan, and fry for two more minutes.


  Once both sides of the steak are golden brown, tip the steak up with a metal spatula
  to drain the excess oil. Remove it from the pan and place if on the wire rack in
  the oven to keep warm. Repeat with the remaining steaks.


  5 Make a roux with fat and flour: Turn off the heat of the pan. Pour out all but
  about 3 tablespoons of fat from the pan. Whisk in 3 tablespoons of flour and turn
  the heat on to medium.


  Let the flour mixture cook until it''s the color of milk chocolate, about 4 to 5
  minutes, stirring constantly.


  6 Stir in milk and cream to make gravy: When the flour fat mixture is smooth and
  a lovely milk chocolate color, slowly add the milk and cream, whisking constantly.
  Note that the mixture will seize up initially, and will loosen as you whisk in more
  liquid.


  Add milk to your desired thickness for gravy. If the gravy is too thick for you,
  add more milk. If it''s too thin, let it cook longer.


  Season with salt to taste. Season with lots of black pepper, to taste.


  7 Serve: Serve chicken fried steak with the gravy and a side of mashed potatoes.'
