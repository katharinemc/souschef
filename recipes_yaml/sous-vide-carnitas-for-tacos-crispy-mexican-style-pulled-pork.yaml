last_planned: null
ingredients:
- name: (1.8kg) boneless pork shoulder cut into 2-inch-thick slabs
  quantity: '4'
  unit: pounds
  section: Ingredients Save Recipe
- name: medium onion roughly chopped
  quantity: '1'
  section: Ingredients Save Recipe
- name: medium cloves garlic
  quantity: '6'
  section: Ingredients Save Recipe
- name: cinnamon broken into 3 to 4 pieces
  quantity: '1'
  unit: stick
  section: Ingredients Save Recipe
- name: bay leaves
  quantity: '2'
  section: Ingredients Save Recipe
- name: medium orange peel intact
  quantity: '1'
  section: Ingredients Save Recipe
- name: Kosher salt
  section: Ingredients Save Recipe
- name: Warm corn tortillas
  section: To Serve
- name: Lime wedges
  section: To Serve
- name: Chopped white onion and fresh cilantro leaves
  section: To Serve
