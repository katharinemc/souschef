id: sous-vide-carnitas-for-tacos-crispy-mexican-style-pulled-pork
name: Sous Vide Carnitas for Tacos (Crispy Mexican-Style Pulled Pork)
tags: []
servings: 8 to 12 servings
prep_time: 5 mins
cook_time: 8 hrs 25 mins
