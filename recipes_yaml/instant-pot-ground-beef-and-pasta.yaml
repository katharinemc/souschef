id: instant-pot-ground-beef-and-pasta
name: Instant Pot Ground Beef and Pasta
tags:
- pasta
servings: 6 servings
prep_time: 20 minutes
cook_time: 20 minutes
source: https://damndelicious.net/2019/05/31/instant-pot-ground-beef-and-pasta/
last_planned: null
ingredients:
- name: olive oil
  quantity: '1'
  unit: tablespoon
- name: lean ground beef
  quantity: '1'
  unit: pound
- name: small onion diced
  quantity: '1'
- name: garlic minced
  quantity: '3'
  unit: cloves
- name: dry red wine*
  quantity: 1/4
  unit: cup
- name: (25-ounce) jar marinara sauce
  quantity: '1'
- name: beef stock
  quantity: 1 3/4
  unit: cups
- name: campanelle pasta
  quantity: '8'
  unit: ounces
- name: Kosher salt and freshly ground black pepper to taste
- name: chopped fresh basil leaves
  quantity: 1/4
  unit: cup
- name: freshly grated Parmesan
  quantity: 1/3
  unit: cup
instructions: 'Set a 6-qt Instant Pot® to the high saute setting. Heat olive oil;
  add ground beef and cook until browned, about 3-5 minutes, making sure to crumble
  the beef as it cooks; drain excess fat.


  Add onion, and cook, stirring frequently, until translucent, about 2-3 minutes.
  Stir in garlic until fragrant, about 1 minute.


  Stir in wine, scraping any browned bits from the bottom of the pot.


  Stir in marinara sauce, beef stock and pasta; season with salt and pepper, to taste.
  Select manual setting; adjust pressure to high, and set time for 5 minutes. When
  finished cooking, quick-release pressure according to manufacturer’s directions.
  Stir in basil and Parmesan.


  Serve immediately.'
notes: null
