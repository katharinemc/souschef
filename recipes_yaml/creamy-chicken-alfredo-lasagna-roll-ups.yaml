id: creamy-chicken-alfredo-lasagna-roll-ups
name: Creamy Chicken Alfredo Lasagna Roll-Ups
tags:
- pasta
servings: '1.5'
prep_time: null
cook_time: null
source: http://www.thekitchn.com/recipe-creamy-alfredo-lasagna-roll-ups-232825?utm_source=RSS&utm_medium=feed&utm_campaign=Category%252FChannel%253A+Main
last_planned: null
ingredients:
- name: dry lasagna noodles
  quantity: '4'
- name: unsalted butter plus more for coating the baking dish
  quantity: '2'
  unit: tablespoons
- name: garlic minced
  quantity: '1'
  unit: clove
- name: heavy cream
  quantity: 1/2
  unit: cup
- name: grated Parmesan cheese
  quantity: 1/4
  unit: cup
- name: lemon juice
  quantity: '1'
  unit: teaspoon
- name: Kosher salt
- name: Freshly ground black pepper
- name: cooked shredded chicken
  quantity: 1/2
  unit: cup
- name: loosely packed baby spinach leaves
  quantity: 1/2
  unit: cup
  section: RED PEPPER
- name: shredded mozzarella cheese
  quantity: 3/4
  unit: cup
  section: RED PEPPER
instructions: 'Arrange a rack in the middle of the oven and heat to 350°F. Lightly
  coat a 9x9-inch baking dish with butter; set aside.


  Bring a large pot of salted water to a boil. Add the lasagna and cook according
  to package directions until al dente. Transfer to a clean towel and lay on a flat
  surface to dry and cool.


  Meanwhile, make the sauce: Melt the 2 tablespoons butter in a small saucepan over
  medium heat. Add the garlic and sauté until fragrant, about 1 minute. Add the cream,
  bring to a simmer, and cook, stirring frequently, until the sauce thickens slightly,
  about 5 minutes. Remove from the heat and add the Parmesan, lemon juice, a big pinch
  of salt, and a few grinds of pepper. Whisk until smooth and set aside.


  Combine the chicken, spinach, 1/2 cup of the mozzarella, and 1 tablespoon of the
  sauce in a large bowl. Divide the mixture among the lasagna noodles and spread into
  an even layer. Starting from a short end, roll up the noodles into a tight roll.
  Place the roll-ups seam-side down, side by side and touching in the baking dish.


  Pour the remaining sauce over the roll-ups, and sprinkle the remaining 1/4 cup mozzarella
  over the top. Bake until heated through and the sauce is bubbling, 15 to 20 minutes.'
notes: "KRM: delicious but originially served too few. A portion should be 3 or 4\
  \ roll ups. Would also recommend more sauce. \n\nStorage: Leftovers can be stored\
  \ in an airtight container in the refrigerator for up to 5 days."
