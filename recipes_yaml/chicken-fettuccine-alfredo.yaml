id: chicken-fettuccine-alfredo
name: Chicken Fettuccine Alfredo
tags:
- pasta
servings: 4 servings
prep_time: 25 min
cook_time: 25 min
source: https://www.foodnetwork.com/recipes/food-network-kitchen/chicken-fettuccine-alfredo-3364118
last_planned: null
ingredients:
- name: Kosher salt and freshly ground black pepper
- name: fettuccine
  quantity: '12'
  unit: ounces
- name: Olive oil for tossing
- name: boneless skinless chicken breast (about 2)
  quantity: '12'
  unit: ounces
- name: (8 tablespoons) unsalted butter
  quantity: '1'
  unit: stick
- name: heavy cream
  quantity: '2'
  unit: cups
- name: freshly grated nutmeg
  quantity: '2'
  unit: pinches
- name: freshly grated Parmigiano-Reggiano
  quantity: 1 1/2
  unit: cups
instructions: 'Bring a large pot of water to a boil, and salt generously. Add the
  pasta and cook according to package directions until al dente (tender but still
  slightly firm). Drain and toss with a splash of oil.


  Meanwhile, slice the chicken into 1/4-inch-thick strips, and lay them on a plate
  or a sheet of waxed paper. Season with salt and pepper.


  Heat a large skillet over medium heat. Add 2 tablespoons of the butter. When the
  butter melts, raise the heat to medium-high and add the chicken in 1 layer. Cook,
  without moving the pieces, until the underside has browned, 1 to 2 minutes. Flip
  the pieces, and cook until browned and cooked through, 2 to 3 minutes more. Transfer
  the chicken to a medium bowl.


  Reduce the heat to medium. Add the remaining 6 tablespoons butter. Scrape the bottom
  of the skillet with a wooden spoon to release any browned bits. When the butter
  has mostly melted, whisk in the cream and nutmeg and bring to a simmer, then cook
  for 2 minutes. Lower the heat to keep the sauce just warm.


  Whisk the Parmigiano-Reggiano into the sauce. Add the chicken and cooked pasta and
  toss well. Season with salt and pepper. Serve hot in heated bowls.'
notes: Don't worry if it seems like there is too much sauce. As soon as everything
  is tossed together, the sauce will start to cling to the pasta and thicken before
  your eyes!
