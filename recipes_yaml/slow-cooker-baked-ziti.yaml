id: slow-cooker-baked-ziti
name: Slow Cooker Baked Ziti
tags:
- pasta
servings: '6'
prep_time: 5 minutes
cook_time: 1 hour to 4 hours
source: https://www.thekitchn.com/slow-cooker-baked-ziti-264554
last_planned: null
ingredients:
- name: Cooking spray
- name: dried ziti pasta
  quantity: '1'
  unit: pound
- name: marinara sauce
  quantity: '48'
  unit: ounces
- name: (15-ounce) container whole milk ricotta cheese
  quantity: '1'
- name: shredded low-moisture mozzarella cheese divided
  quantity: '2'
  unit: cups
instructions: 'Coat a 6-quart or larger slow cooker with cooking spray. Add the ziti,
  marinara, ricotta, and 1 cup of the mozzarella cheese, and stir well to combine.
  Sprinkle with the remaining 1 cup of mozzarella.


  Cover and cook until the pasta is cooked through and the cheese is melted, on the
  LOW setting for 3 to 4 hours or on the HIGH setting for 1 to 2 hours. Serve immediately.'
notes: 'Storage: Leftovers can be refrigerated in an airtight container for up to
  5 days.'
