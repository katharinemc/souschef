id: indian-butter-chicken
name: Indian Butter Chicken
tags: []
servings: '4'
prep_time: 10 mins
cook_time: 20 mins
source: http://thekitchenpaper.com/indian-butter-chicken/
last_planned: null
ingredients:
- name: butter divided
  quantity: '6'
  unit: tablespoons
- name: chicken breasts cut into 1″ chunks
  quantity: '2'
  unit: lbs
- name: yellow onion diced
  quantity: '1'
- name: garlic cloves minced
  quantity: '3'
- name: garam masala
  quantity: '3'
  unit: tsp
- name: fresh grated ginger
  quantity: '1'
  unit: Tbsp
- name: chili powder
  quantity: '1'
  unit: tsp
- name: ground cumin
  quantity: '1'
  unit: tsp
- name: cayenne pepper
  quantity: 1/2
  unit: tsp
- name: tomato sauce**** (or one 14 oz can would work)
  quantity: 1 1/2
  unit: cups
- name: cream*
  quantity: '2'
  unit: cups
- name: salt & pepper
- name: lime & cilantro for garnish
- name: naan & rice for serving
instructions: 'Using 2 Tbsp of butter in a large skillet over medium-high heat, brown
  the pieces of the chicken so each side is browned. They do not need to be fully
  cooked all the way through. Work in batches, and set aside when you’re done.


  Melt another 2 Tbsp of butter in the pan over medium heat. Add the onion, and cook
  until beginning to soften — about three minutes. Add the garlic, garam masala, ginger,
  chili powder, cumin, and cayenne. Stir to combine, and cook for about 45 seconds
  before adding the tomato sauce.


  Bring the mixture to a simmer and let cook for five minutes before adding the cream.
  Bring the mixture back to a simmer, add the browned chicken, and let simmer for
  10-15 minutes. Keep the heat low here — not a rolling boil.


  Stir in the remaining 2 Tbsp of butter, and season with salt and pepper, to taste.


  Serve garnished with lime and cilantro, alongside rice and naan.'
