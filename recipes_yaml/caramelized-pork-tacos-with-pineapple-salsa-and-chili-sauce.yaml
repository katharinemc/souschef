id: caramelized-pork-tacos-with-pineapple-salsa-and-chili-sauce
name: Caramelized Pork Tacos with Pineapple Salsa and Chili Sauce
tags: []
servings: 6-8 tacos
prep_time: null
cook_time: null
source: http://pinchofyum.com/caramelized-pork-tacos-with-pineapple-salsa
last_planned: null
ingredients:
- name: 'For the Pork:'
- name: oil
  quantity: '1'
  unit: tablespoon
- name: shallot
  quantity: '1'
- name: garlic
  quantity: '1'
  unit: clove
- name: jalapeno ribs and seeds removed
  quantity: '1'
- name: fish sauce
  quantity: '2'
  unit: teaspoons
- name: boneless pork loin sliced into thin strips
  quantity: '18'
  unit: ounces
- name: sugar
  quantity: '2'
  unit: tablespoons
- name: water
  quantity: '2'
  unit: tablespoons
- name: 'For the Pineapple Salsa:'
- name: chopped pineapple
  quantity: '1'
  unit: cup
- name: chopped cucumber
  quantity: '1'
  unit: cup
- name: chopped cilantro
  quantity: ½
  unit: cup
- name: chopped red onion or shallot
  quantity: ½
  unit: cup
- name: a squeeze of lime juice
- name: a pinch of salt
- name: tortillas for serving
- name: cilantro and lime for serving
- name: chili sauce for topping - see notes
instructions: 'For the pork: Heat the oil in a heavy pan over medium heat. Add the
  shallot, garlic, and jalapeño - saute until fragrant, about 2 minutes. Turn the
  heat to high and add the pork and the fish sauce - stir fry for a few minutes until
  the pork is no longer pink. With the heat very high, add the sugar and water and
  stir once - then let the pork caramelize by not stirring it for about 1 minute.
  Repeat this process until the pork is nice and golden brown.


  For the salsa: Toss everything together in a medium bowl.


  For the tacos: Warm the tortillas quickly in a skillet with a little bit of oil.
  Arrange the pork between 6 tortillas and top with the salsa and the chili sauce.


  For leftovers, store each element (pork, salsa, and sauce) separately.'
notes: For the chili sauce, combine two parts mayo and one part hot sauce (more or
  less depending on how hot your hot sauce actually is - I used Sriracha which is
  just moderately spicy). Whisk to combine or shake in a jar. Add water if needed
  to thin out the consistency - serve over the tacos.
