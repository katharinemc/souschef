id: creamy-lemon-garlic-instant-pot-chicken-breasts
name: Creamy Lemon Garlic Instant Pot Chicken Breasts
tags:
- onRotation
servings: '4'
prep_time: 10 mins
cook_time: 20 mins
source: https://sweetpeasandsaffron.com/instant-pot-creamy-lemon-chicken-breasts/?utm_medium=social&utm_source=pinterest&utm_campaign=tailwind_tribes&utm_content=tribes&utm_term=337974946_10230702_107939
last_planned: null
ingredients:
- name: boneless skinless chicken breasts roughly 1 lb
  quantity: '2'
- name: dried oregano
  quantity: 1/2
  unit: teaspoon
- name: dried basil
  quantity: 1/2
  unit: teaspoon
- name: red pepper flakes
  quantity: 1/4
  unit: teaspoon
- name: garlic minced
  quantity: '4'
  unit: cloves
- name: chicken stock
  quantity: '1'
  unit: cup
- name: lemon juice
  quantity: '2'
  unit: tablespoons
  section: AFTER REDUCING SAUCE
- name: parmesan cheese freshly grated
  quantity: 1/4
  unit: cup
  section: AFTER REDUCING SAUCE
- name: 'heavy cream aka: whipping cream for Canadians'
  quantity: 3/4
  unit: cup
  section: AFTER REDUCING SAUCE
instructions: 'Combine all ingredients in a 6 quart Instant Pot (unless listed as
  ''after reducing sauce'').

  Cook on high pressure for 8 minutes (for average 7 oz chicken breasts). Release
  the pressure when the Instant Pot beeps (quick pressure release).

  Using a pair of tongs, carefully remove the chicken from the Instant Pot and allow
  to rest while you reduce the sauce.

  Reduce the sauce: select ''sautee'' on the Instant Pot, and simmer, stirring occasionally,
  for 7-10 minutes.

  When roughly 1/3 of a cup of the sauce remains (and you start to see the bottom
  of the IP as you stir), stir in the parmesan cheese, cream, and lemon (for the lemon
  garlic chicken only). Stir until cheese is melted and sauce is heated through (but
  not boiling), and remove the pot from the Instant Pot base using oven mitts.

  Spoon the sauce over chicken breast, rice and veggies.

  To prepare freezer pack:

  Combine all ingredients in a gallon freezer bag (unless listed as ''after reducing
  sauce'').

  Squeeze out as much air as possible. Freeze for up to 3 months.

  Thaw completely before cooking as instructed above.'
