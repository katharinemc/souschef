id: spicy-southern-style-cabbage-with-bacon-keto-low-carb
name: Spicy Southern Style Cabbage with Bacon | Keto, Low-Carb
tags:
- onRotation
servings: 6 servings
prep_time: 10 minutes
cook_time: 45 minutes
source: https://www.agirlcalledadri.com/spicy-southern-style-cabbage-keto/
last_planned: null
ingredients:
- name: Bacon ( 10 slices) Chopped
  quantity: '100'
  unit: g
- name: Garlic Cloves minced or chopped
  quantity: '3'
- name: Medium Head of Cabbage chopped or torn into bite sized pieces
  quantity: '1'
- name: Chicken Broth
  quantity: 1/2
  unit: cup
- name: Apple Cider Vinegar
  quantity: '1'
  unit: tablespoon
- name: Salt
  quantity: 1/2
  unit: teaspoon
- name: .5 teaspoon Red Pepper Flakes
  quantity: '1'
- name: Smoked Paprika
  quantity: '1'
  unit: teaspoon
- name: Black Pepper
  quantity: 1/2
  unit: teaspoon
- name: Garlic Powder
  quantity: 1/2
  unit: teaspoon
instructions: 'In a large pot (with accompanying lid) cook the bacon until nearly
  done.


  Add the chopped or minced garlic and cook for 2-3 minutes.


  Add the cabbage and stir well; until the bacon and garlic are distributed evenly.


  Add the bone broth, ACV, salt, red pepper flakes, smoked paprika, black pepper,
  and garlic powder. Give everything another good stir.


  5. Cover the pot with a lid and cook for 40-45 minutes, stirring occasionally.'
notes: '*Note: if you’re spice averse then you’re more than welcome to exclude the
  red pepper flakes. On the other side of the coin, if you want to kick things up
  a notch, stir in a half teaspoon of cayenne powder.'
