id: baked-spaghetti
name: Baked Spaghetti
tags: []
servings: '8'
prep_time: 15 mins
cook_time: 1 hr 15 mins
source: https://www.allrecipes.com/recipe/222582/baked-spaghetti/
last_planned: null
ingredients:
- name: (16 ounce) package spaghetti
  quantity: '1'
- name: ground beef
  quantity: '1'
  unit: pound
- name: onion chopped
  quantity: '1'
- name: (32 ounce) jar meatless spaghetti sauce
  quantity: '1'
- name: seasoned salt
  quantity: ½
  unit: teaspoon
- name: large eggs
  quantity: '2'
- name: grated Parmesan cheese
  quantity: ⅓
  unit: cup
- name: butter melted
  quantity: '5'
  unit: tablespoons
- name: small curd cottage cheese
  quantity: '2'
  unit: cups
- name: shredded mozzarella cheese divided
  quantity: '5'
  unit: cups
instructions: 'Gather all ingredients. Preheat the oven to 350 degrees F (175 degrees
  C). Lightly grease a 9x13-inch baking dish.


  Bring a large pot of lightly salted water to a boil. Cook spaghetti in boiling water,
  stirring occasionally, until tender but firm to the bite, about 12 minutes. Drain.


  Meanwhile, heat a large skillet over medium heat. Cook and stir beef and onion in
  the hot skillet until meat is browned and onion is soft and translucent, about 5
  to 7 minutes.


  Drain excess oil from the pan; stir in spaghetti sauce and seasoned salt.


  Whisk eggs, Parmesan, and butter in a large bowl. Add spaghetti and toss to coat.


  Place 1/2 of the spaghetti mixture in the prepared baking dish. Top with 1/2 of
  the cottage cheese, 2 cups mozzarella, and 1/2 of the meat sauce. Repeat layers.
  Cover with aluminum foil.


  Bake in the preheated oven for 40 minutes. Remove the foil and sprinkle with remaining
  1 cup mozzarella.


  Continue to bake until cheese is melted and lightly browned, 20 to 25 minutes.


  Serve and enjoy!'
